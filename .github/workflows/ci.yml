name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Apply every migration to a fresh local D1 database
        run: npm run db:migrate:local
      - run: npm run build
      - name: Validate both Worker bundles
        run: |
          npx wrangler deploy --dry-run --config dist/server/wrangler.json
          npx wrangler deploy --dry-run --config jobs/wrangler.json --env=""
      - name: Browser, keyboard, responsive, and accessibility checks
        run: npx playwright test --workers=2
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Keep browser diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
