name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOYMENTS == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Record prior versions if present
        continue-on-error: true
        run: npx wrangler versions list --config wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          BOT_API_ORIGIN: ${{ vars.BOT_API_ORIGIN }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          BOT_DISCORD_GUILD_ID: ${{ vars.BOT_DISCORD_GUILD_ID }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      - id: smoke
        continue-on-error: true
        run: npm run smoke
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      - name: Roll back a failed release
        if: steps.smoke.outcome == 'failure'
        run: >-
          npx wrangler rollback
          --config wrangler.jsonc
          --env production
          --yes
          --message "Automatic rollback after failed smoke check"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Mark a rolled-back release as failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
