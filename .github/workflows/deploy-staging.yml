name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      INITIAL_ADMIN_DISCORD_ID: ${{ vars.INITIAL_ADMIN_DISCORD_ID }}
      BETTER_AUTH_URL: ${{ vars.APP_URL }}
      APP_URL: ${{ vars.APP_URL }}
      MONITOR_HEARTBEAT_URL: ${{ secrets.MONITOR_HEARTBEAT_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:staging
      - run: node scripts/write-deploy-secrets.mjs main
      - name: Apply backward-compatible D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Upload an immutable candidate
        run: >-
          npx wrangler versions upload
          --config dist/server/wrangler.json
          --secrets-file .wrangler/generated/main-secrets.json
          --tag "${{ github.event.workflow_run.head_sha }}"
          --message "staging ${{ github.event.workflow_run.head_sha }}"
          --preview-alias candidate
      - name: Smoke-test the candidate version
        run: curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 "${{ vars.PREVIEW_URL }}/api/health/ready"
      - name: Promote the candidate atomically
        id: promote
        run: >-
          npx wrangler versions deploy
          --config dist/server/wrangler.json
          --version-tag "${{ github.event.workflow_run.head_sha }}"
          --message "staging ${{ github.event.workflow_run.head_sha }}"
          --yes
      - name: Deploy the jobs Worker
        id: jobs
        continue-on-error: true
        run: npm run deploy:jobs:staging
      - name: Synchronize guild commands
        id: commands
        continue-on-error: true
        run: npm run discord:sync
      - name: Smoke-test staging
        id: smoke
        continue-on-error: true
        run: curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 "${{ vars.APP_URL }}/api/health/ready"
      - name: Roll back an incomplete staging release
        if: >-
          always() && steps.promote.outcome == 'success' &&
          (steps.jobs.outcome == 'failure' ||
           steps.commands.outcome == 'failure' ||
           steps.smoke.outcome == 'failure')
        run: npx wrangler rollback --config dist/server/wrangler.json --message "automatic rollback after incomplete staging release" --yes
      - name: Fail an incomplete staging release
        if: >-
          always() && steps.promote.outcome == 'success' &&
          (steps.jobs.outcome == 'failure' ||
           steps.commands.outcome == 'failure' ||
           steps.smoke.outcome == 'failure')
        run: exit 1
